{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-header bg-danger text-white">

                    <h4 class="mb-0">
                        Confirm Delete
                    </h4>

                </div>


                <div class="card-body text-center">

                    <h5 class="mb-3">
                        Are you sure?
                    </h5>

                    <p>
                        Do you want to delete payroll for
                        <strong>
                            {{ payroll.employee.name }}
                        </strong>?
                    </p>

                    <p class="text-muted">
                        {{ payroll.month|date:"F Y" }}
                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Yes, Delete
                        </button>

                        <a
                            href="{% url 'payroll_list' %}"
                            class="btn btn-secondary"
                        >
                            No, Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

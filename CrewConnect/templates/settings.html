{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="mb-4">

        <h2>Settings</h2>

        <p class="text-muted">
            Manage your CrewConnect account settings
        </p>

    </div>

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <div class="d-flex align-items-center mb-4">

                        <i class="bi bi-lock fs-2 me-3"></i>

                        <div>

                            <h5 class="mb-1">
                                Password
                            </h5>

                            <p class="text-muted mb-0">
                                Change your account password
                            </p>

                        </div>

                    </div>

                    <a
                        href="{% url 'change_password' %}"
                        class="btn btn-primary"
                    >
                        Change Password
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
